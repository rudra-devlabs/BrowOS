    <style>
        #boot-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            transition: opacity 0.2s ease;
        }
        #boot-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            width: 120px;
            height: 120px;
            animation: boot-spin 2s linear infinite;
            margin-bottom: 40px;
        }
        @keyframes boot-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #boot-progress-track {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        #boot-progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s ease;
        }
        #crash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100001;
        }
        #crash-screen.visible {
            display: flex;
        }
        .crash-window {
            background: #2a2a2c;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            width: 420px;
            overflow: hidden;
            animation: crash-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        @keyframes crash-pop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .crash-header {
            height: 32px;
            background: #3a3a3c;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }
        .crash-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .crash-dot.red { background: #ff5f57; }
        .crash-dot.yellow { background: #febc2e; }
        .crash-dot.green { background: #28c840; }
        .crash-title {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #d1d1d6;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .crash-body {
            padding: 24px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .crash-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            color: #ff3b30;
        }
        .crash-body h2 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px;
        }
        .crash-body p {
            color: #a1a1a6;
            font-size: 13px;
            margin: 0 0 16px;
            line-height: 1.4;
        }
        .crash-error {
            background: #1a1a1c;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .crash-error code {
            color: #ff6b6b;
            font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
            font-size: 11px;
            word-break: break-all;
            display: block;
            line-height: 1.5;
        }
        .crash-btn {
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 24px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background 0.15s;
        }
        .crash-btn:hover {
            background: #0066d6;
        }
        .crash-btn.danger {
            background: #ff3b30;
        }
        .crash-btn.danger:hover {
            background: #d63027;
        }
        .crash-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        #shutdown-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100002;
            flex-direction: column;
        }
        #shutdown-overlay.visible {
            display: flex;
        }
        #shutdown-overlay.fade-in {
            animation: shutdown-fade 1.5s ease forwards;
        }
        @keyframes shutdown-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #shutdown-text {
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 16px;
            margin-top: 20px;
            opacity: 0.8;
        }
        #powered-off-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100003;
        }
        #powered-off-screen.visible {
            display: flex;
        }
        #powered-off-logo {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 24px;
        }
        #start-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #start-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.5);
        }
        #start-btn svg {
            width: 18px;
            height: 18px;
        }

<body>

    <!-- Core System Scripts -->
    <script>
        window.BrowOS = {
            shutdown: function() {
                try { window.BrowSettings?.audio?.play('shutdown'); } catch (e) {}
                const crashScreen = document.getElementById('crash-screen');
                const shutdownOverlay = document.getElementById('shutdown-overlay');
                const poweredOffScreen = document.getElementById('powered-off-screen');

                crashScreen.style.display = 'none';
                shutdownOverlay.classList.add('visible', 'fade-in');

                setTimeout(() => {
                    shutdownOverlay.classList.remove('visible', 'fade-in');
                    poweredOffScreen.classList.add('visible');
                }, 2000);
            },

            restart: function() {
                // Close all windows
                if (window.windowManager && window.windowManager.windows) {
                    window.windowManager.windows.forEach(w => {
                        if (w.element && w.element.parentNode) {
                            w.element.remove();
                        }
                    });
                    window.windowManager.windows = [];
                }

                // Reset terminal
                if (window.BrowShell && window.BrowShell.instance) {
                    const shell = window.BrowShell.instance;
                    if (shell.term) {
                        shell.term.clear();
                        shell.term.reset();
                    }
                    if (shell._resizeObserver) {
                        shell._resizeObserver.disconnect();
                    }
                    shell.inputBuffer = [];
                    shell.commandHistory = [];
                    shell.historyIndex = -1;
                    shell.currentInput = '';
                    shell.cursorPos = 0;
                    shell.isProcessing = false;
                    window.BrowShell.instance = null;
                }

                // Reload page
                location.reload();
            },

            start: function() {
                const poweredOffScreen = document.getElementById('powered-off-screen');
                poweredOffScreen.classList.remove('visible');
                location.reload();
            }
        };
    </script>
    <script>
        (function() {
            const BOOT_STEPS = [
                { id: 'icons', label: 'icons.js', critical: true },
                { id: 'apps', label: 'apps.js', critical: true },
                { id: 'desktop', label: 'desktop.js', critical: true },
                { id: 'window', label: 'window.js', critical: true },
                { id: 'filesystem', label: 'filesystem.js', critical: true },
                { id: 'filepicker', label: 'filepicker.js', critical: false },
                { id: 'filebrow', label: 'filebrow.js', critical: false },
                { id: 'shell', label: 'shell.js', critical: false },
                { id: 'xterm', label: 'xterm.js', critical: false },
                { id: 'wallpapers', label: 'wallpapers', critical: false },
                { id: 'dock-icons', label: 'dock icons', critical: false }
            ];

            const progressFill = document.getElementById('boot-progress-fill');
            const bootScreen = document.getElementById('boot-screen');
            const crashScreen = document.getElementById('crash-screen');
            const crashErrorText = document.getElementById('crash-error-text');
            const desktop = document.getElementById('desktop');

            const completedSteps = new Set();
            const total = BOOT_STEPS.length;
            const criticalFailures = [];
            let isBooted = false;

            // Boot watchdog: Force completion if network, fonts, or CDNs hang
            const bootWatchdog = setTimeout(() => {
                if (!isBooted) {
                    console.warn('[Boot Resilience] Watchdog safeguard triggered (3500ms). Forcing boot complete.');
                    bootComplete();
                }
            }, 3500);

            function updateProgress() {
                const pct = Math.round((completedSteps.size / total) * 100);
                progressFill.style.width = Math.min(pct, 100) + '%';
            }

            function markStep(id, success, error) {
                if (completedSteps.has(id)) return;
                completedSteps.add(id);

                const stepDef = BOOT_STEPS.find(s => s.id === id);
                if (!success) {
                    if (stepDef && stepDef.critical) {
                        criticalFailures.push({ id, error: error || 'Unknown' });
                    } else {
                        console.warn(`[Boot Resilience] Non-critical step failed or delayed: ${id}`, error);
                        window._degradedApps = window._degradedApps || new Set();
                        window._degradedApps.add(id);
                    }
                }
                updateProgress();

                if (completedSteps.size >= total) {
                    if (criticalFailures.length > 0) {
                        showCrash(criticalFailures);
                    } else {
                        bootComplete();
                    }
                }
            }

            function showCrash(failures) {
                clearTimeout(bootWatchdog);
                const msgs = failures.map(f => `[${f.id}] ${f.error}`).join('\n');
                crashErrorText.textContent = msgs;
                bootScreen.style.display = 'none';
                crashScreen.classList.add('visible');
            }

            function bootComplete() {
                if (isBooted) return;
                isBooted = true;
                clearTimeout(bootWatchdog);

                try { window.BrowSettings?.audio?.play('boot'); } catch (e) {}
                bootScreen.classList.add('fade-out');
                desktop.style.display = '';

                // Gracefully degrade any non-critical components that failed
                if (window._degradedApps && window._degradedApps.size > 0) {
                    window._degradedApps.forEach(appId => {
                        const dockEl = document.querySelector(`.dock-app[data-app="${appId}"]`);
                        if (dockEl) {
                            dockEl.style.opacity = '0.4';
                            dockEl.title = `${appId} (Degraded / Offline)`;
                        }
                    });
                }

                setTimeout(() => {
                    bootScreen.style.display = 'none';
                }, 200);
            }

            window._bootStep = markStep;
            window._bootFail = function(id, err) { markStep(id, false, err); };
        })();
    </script>

    <script>
        (function() {
            if (typeof Terminal !== 'undefined') {
                window._bootStep('xterm', true);
            } else {
                console.warn('[Boot Resilience] xterm.js CDN failed or offline. Terminal will run in fallback mode.');
                window._bootStep('xterm', true);
            }
            window._bootStep('wallpapers', true);
            window._bootStep('dock-icons', true);
        })();
    </script>
