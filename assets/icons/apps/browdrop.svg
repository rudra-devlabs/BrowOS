<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="50%" stop-color="#0066d6"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <radialGradient id="bd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bd-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bd-bg)" filter="url(#bd-drop-shadow)"/>
  
  <!-- Subtle highlight shine -->
  <rect x="9" y="9" width="110" height="55" rx="25" fill="url(#bd-glow)"/>

  <!-- AirDrop Radar Arcs -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Outer wave -->
    <path d="M 28 88 A 46 46 0 0 1 100 88" stroke-width="5" stroke-opacity="0.5"/>
    <!-- Mid wave -->
    <path d="M 40 88 A 32 32 0 0 1 88 88" stroke-width="5" stroke-opacity="0.75"/>
    <!-- Inner wave -->
    <path d="M 52 88 A 18 18 0 0 1 76 88" stroke-width="5" stroke-opacity="0.95"/>
  </g>

  <!-- Central Source Node -->
  <circle cx="64" cy="88" r="5.5" fill="#ffffff"/>

  <!-- Orbiting Peer Nodes -->
  <circle cx="38" cy="38" r="4.5" fill="#64d2ff" filter="url(#bd-drop-shadow)"/>
  <circle cx="90" cy="42" r="5" fill="#30d158" filter="url(#bd-drop-shadow)"/>
  <circle cx="64" cy="24" r="3.5" fill="#ffd60a"/>

  <!-- Subtle connecting beam signals -->
  <line x1="64" y1="88" x2="38" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.35"/>
  <line x1="64" y1="88" x2="90" y2="42" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.35"/>
</svg>
