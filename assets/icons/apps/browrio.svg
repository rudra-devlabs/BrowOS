<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="brSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b9ce8"/>
      <stop offset="0.55" stop-color="#7ab8ee"/>
      <stop offset="1" stop-color="#b3d6f5"/>
    </linearGradient>
    <linearGradient id="brGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec850"/>
      <stop offset="1" stop-color="#3f9b2f"/>
    </linearGradient>
    <linearGradient id="brDirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a66843"/>
      <stop offset="1" stop-color="#6a3f25"/>
    </linearGradient>
    <linearGradient id="brBrick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e84a3a"/>
      <stop offset="1" stop-color="#a52d1f"/>
    </linearGradient>
    <linearGradient id="brPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fc25a"/>
      <stop offset="1" stop-color="#1f7a30"/>
    </linearGradient>
    <linearGradient id="brCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e84a3a"/>
      <stop offset="0.4%" stop-color="#b21f0e"/>
      <stop offset="1" stop-color="#7a1607"/>
    </linearGradient>
    <linearGradient id="brCoin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="0.5" stop-color="#f4b400"/>
      <stop offset="1" stop-color="#b47800"/>
    </linearGradient>
    <linearGradient id="brBoots" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2818"/>
      <stop offset="1" stop-color="#1a0c05"/>
    </linearGradient>
    <radialGradient id="brCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="brGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="100" height="100" rx="20" fill="url(#brSky)"/>

  <!-- Distant mountains -->
  <polygon points="0,72 18,46 32,68 48,40 62,66 78,50 92,68 100,64 100,100 0,100" fill="#6a8ec0" opacity="0.4"/>
  <polygon points="0,78 14,58 28,74 42,52 56,72 70,60 86,74 100,68 100,100 0,100" fill="#5a7eb0" opacity="0.3"/>

  <!-- Clouds -->
  <g filter="url(#brGlow)">
    <ellipse cx="22" cy="22" rx="11" ry="5" fill="url(#brCloud)"/>
    <ellipse cx="28" cy="20" rx="7" ry="4" fill="url(#brCloud)"/>
    <ellipse cx="78" cy="18" rx="9" ry="4" fill="url(#brCloud)"/>
    <ellipse cx="72" cy="20" rx="6" ry="3" fill="url(#brCloud)"/>
  </g>

  <!-- Sun -->
  <circle cx="84" cy="18" r="6" fill="#fff4b8" opacity="0.95"/>
  <circle cx="84" cy="18" r="9" fill="#fff4b8" opacity="0.25"/>

  <!-- Floating coin (foreground top) -->
  <g transform="translate(72 28)">
    <circle r="5" fill="url(#brCoin)" stroke="#8a5a00" stroke-width="1"/>
    <ellipse rx="2.5" ry="3.8" fill="none" stroke="#8a5a00" stroke-width="0.8"/>
    <path d="M-1 -2 L1 -2 M-1 0 L1 0 M-1 2 L1 2" stroke="#8a5a00" stroke-width="0.6"/>
    <circle cx="-1.5" cy="-1.5" r="1" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Question block -->
  <g transform="translate(58 36)">
    <rect x="0" y="0" width="14" height="14" fill="url(#brBrick)" stroke="#7a1607" stroke-width="1.2"/>
    <rect x="0" y="0" width="14" height="2" fill="#ffb088" opacity="0.6"/>
    <rect x="0" y="6" width="14" height="2" fill="#7a1607" opacity="0.4"/>
    <!-- Bolts -->
    <circle cx="2" cy="2" r="0.8" fill="#5a0f04"/>
    <circle cx="12" cy="2" r="0.8" fill="#5a0f04"/>
    <circle cx="2" cy="12" r="0.8" fill="#5a0f04"/>
    <circle cx="12" cy="12" r="0.8" fill="#5a0f04"/>
    <!-- Question mark -->
    <text x="7" y="11" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
  </g>

  <!-- Brick block (broken / used) -->
  <g transform="translate(40 36)">
    <rect x="0" y="0" width="12" height="12" fill="#8b5a3c" stroke="#5a3a1f" stroke-width="1"/>
    <path d="M0 0 L6 6 L4 8 L0 4 Z M6 6 L12 0 L12 4 L8 8 Z" fill="#5a3a1f" opacity="0.7"/>
    <line x1="0" y1="0" x2="12" y2="12" stroke="#3a2210" stroke-width="0.6"/>
    <line x1="12" y1="0" x2="0" y2="12" stroke="#3a2210" stroke-width="0.6"/>
  </g>

  <!-- Pipe -->
  <g transform="translate(8 56)">
    <rect x="2" y="14" width="20" height="20" fill="url(#brPipe)" stroke="#1f7a30" stroke-width="1.2"/>
    <rect x="0" y="10" width="24" height="6" fill="url(#brPipe)" stroke="#1f7a30" stroke-width="1.2"/>
    <rect x="0" y="10" width="24" height="2" fill="#5cd87a" opacity="0.6"/>
    <rect x="4" y="16" width="2" height="18" fill="#5cd87a" opacity="0.5"/>
  </g>

  <!-- Ground / grass top -->
  <rect x="0" y="76" width="100" height="24" fill="url(#brDirt)"/>
  <!-- Grass tufts (top of ground) -->
  <path d="M0 76 L4 70 L6 76 L10 68 L13 76 L18 70 L21 76 L25 67 L28 76 L33 70 L36 76 L40 68 L43 76 L48 70 L51 76 L55 67 L58 76 L63 70 L66 76 L70 68 L73 76 L78 70 L81 76 L85 67 L88 76 L93 70 L96 76 L100 70 L100 78 L0 78 Z" fill="url(#brGround)"/>
  <!-- Dirt texture: dots -->
  <g fill="#3d2410" opacity="0.5">
    <circle cx="14" cy="84" r="1"/>
    <circle cx="30" cy="88" r="0.8"/>
    <circle cx="46" cy="82" r="1"/>
    <circle cx="62" cy="90" r="0.9"/>
    <circle cx="78" cy="86" r="1"/>
    <circle cx="92" cy="92" r="0.7"/>
    <circle cx="20" cy="94" r="0.6"/>
    <circle cx="52" cy="96" r="0.8"/>
  </g>
  <g fill="#7a4a25" opacity="0.4">
    <circle cx="10" cy="90" r="0.7"/>
    <circle cx="26" cy="96" r="0.6"/>
    <circle cx="42" cy="94" r="0.8"/>
    <circle cx="58" cy="86" r="0.7"/>
    <circle cx="74" cy="92" r="0.6"/>
    <circle cx="88" cy="98" r="0.7"/>
  </g>

  <!-- Character (Browrio) -->
  <g transform="translate(38 48)">
    <!-- Boots -->
    <rect x="0" y="22" width="6" height="4" fill="url(#brBoots)"/>
    <rect x="8" y="22" width="6" height="4" fill="url(#brBoots)"/>
    <rect x="0" y="22" width="6" height="1" fill="#7a4a25"/>
    <rect x="8" y="22" width="6" height="1" fill="#7a4a25"/>
    <!-- Legs (blue overalls bottom) -->
    <rect x="1" y="16" width="5" height="8" fill="#1e3a8a"/>
    <rect x="8" y="16" width="5" height="8" fill="#1e3a8a"/>
    <!-- Torso (blue overalls) -->
    <rect x="0" y="8" width="14" height="10" fill="#2b4cb8"/>
    <rect x="0" y="8" width="14" height="2" fill="#4068d8" opacity="0.7"/>
    <!-- Overall buttons -->
    <circle cx="3" cy="11" r="0.8" fill="#ffd700"/>
    <circle cx="11" cy="11" r="0.8" fill="#ffd700"/>
    <!-- Shirt sleeves (red) -->
    <rect x="0" y="6" width="3" height="6" fill="#c92e1e"/>
    <rect x="11" y="6" width="3" height="6" fill="#c92e1e"/>
    <!-- Hands (skin) -->
    <rect x="0" y="11" width="3" height="4" fill="#ffcf9e"/>
    <rect x="11" y="11" width="3" height="4" fill="#ffcf9e"/>
    <!-- Head (skin) -->
    <rect x="1" y="0" width="12" height="8" fill="#ffcf9e"/>
    <!-- Cap (red) -->
    <path d="M0 4 L0 0 L13 0 L13 4 L7 4 L7 6 L4 6 L4 4 Z" fill="#e84a3a"/>
    <path d="M0 4 L13 4 L13 5 L0 5 Z" fill="#a52d1f"/>
    <!-- Cap brim -->
    <rect x="13" y="3" width="4" height="2" fill="#c92e1e"/>
    <!-- "B" emblem on cap -->
    <text x="6" y="3.5" font-family="serif" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
    <!-- Eye -->
    <circle cx="9" cy="2.5" r="0.7" fill="#000"/>
    <!-- Mustache -->
    <rect x="6" y="5" width="6" height="1.2" fill="#3a2210"/>
    <ellipse cx="9" cy="5.6" rx="3" ry="0.8" fill="#3a2210"/>
  </g>

  <!-- Ground sparkles -->
  <g fill="#fff" opacity="0.6">
    <circle cx="50" cy="80" r="0.6"/>
    <circle cx="70" cy="82" r="0.5"/>
  </g>
</svg>
