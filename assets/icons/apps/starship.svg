<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="128" height="128">
  <defs>
    <linearGradient id="shipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29"/>
      <stop offset="100%" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="0.55" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#63B3ED"/>
      <stop offset="0.5" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="engineGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#63B3ED"/>
      <stop offset="0.5" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <radialGradient id="cockpitGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8d4f0"/>
      <stop offset="1" stop-color="#1a5a8a"/>
    </radialGradient>
    <linearGradient id="exhaustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="0.4" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d4e6ff"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="bkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="engineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="weaponGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="cockpitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="shipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#shipBg)"/>
  <!-- Starfield -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="1.3" opacity="0.4"/>
    <circle cx="45" cy="30" r="0.8" opacity="0.35"/>
    <circle cx="70" cy="25" r="1.1" opacity="0.5"/>
    <circle cx="95" cy="35" r="0.7" opacity="0.45"/>
    <circle cx="30" cy="45" r="0.9" opacity="0.3"/>
    <circle cx="15" cy="60" r="1" opacity="0.5"/>
    <circle cx="55" cy="70" r="0.8" opacity="0.4"/>
    <circle cx="85" cy="60" r="1.2" opacity="0.55"/>
    <circle cx="65" cy="85" r="0.9" opacity="0.35"/>
    <circle cx="100" cy="80" r="1" opacity="0.4"/>
    <circle cx="25" cy="90" r="0.7" opacity="0.3"/>
    <circle cx="80" cy="95" r="0.9" opacity="0.5"/>
    <circle cx="40" cy="15" r="0.8" opacity="0.45"/>
    <circle cx="65" cy="15" r="1.1" opacity="0.35"/>
    <circle cx="105" cy="50" r="0.8" opacity="0.4"/>
    <circle cx="10" cy="75" r="0.7" opacity="0.3"/>
  </g>

  <!-- Nebula backdrop -->
  <ellipse cx="70" cy="100" rx="45" ry="20" fill="#4facfe" opacity="0.06"/>
  <ellipse cx="40" cy="110" rx="35" ry="15" fill="#2ec4b6" opacity="0.05"/>
  <ellipse cx="85" cy="90" rx="28" ry="12" fill="#1a1a2e" opacity="0.08"/>

  <!-- Scanline grid -->
  <g stroke="#00f2fe" stroke-width="0.4" opacity="0.1">
    <line x1="25" y1="95" x2="95" y2="95"/>
    <line x1="25" y1="98" x2="95" y2="98"/>
    <line x1="25" y1="101" x2="95" y2="101"/>
    <line x1="38" y1="95" x2="38" y2="105"/>
    <line x1="55" y1="95" x2="55" y2="105"/>
    <line x1="72" y1="95" x2="72" y2="105"/>
    <line x1="89" y1="95" x2="89" y2="105"/>
  </g>

  <!-- Ship group with shadow filter -->
  <g filter="url(#shipShadow)">
    <!-- Main hull -->
    <path d="M60 28 L95 90 L50 78 L15 90 Z"
      fill="url(#shipGrad)" stroke="#63B3ED" stroke-width="2" stroke-linejoin="round"/>
    <!-- Hull shading -->
    <path d="M50 40 L50 78 M50 50 Q58 58 60 78 M50 60 Q42 68 40 78"
      fill="none" stroke="#2B6CB0" stroke-width="1" opacity="0.5"/>
    <!-- Wing bottom faces -->
    <path d="M60 28 L95 90 L85 88 L55 30 Z" fill="url(#wingGrad)" stroke="#3a8ed0" stroke-width="1"/>
    <path d="M60 28 L15 90 L25 88 L55 30 Z" fill="url(#wingGrad2)" stroke="#3a8ed0" stroke-width="1"/>
    <!-- Engine intakes -->
    <path d="M16 90 L26 80 L26 88 L16 90 Z" fill="url(#engineGrad)" stroke="#4A90E2" stroke-width="1"/>
    <path d="M83 80 L94 90 L94 82 L83 80 Z" fill="url(#engineGrad2)" stroke="#4A90E2" stroke-width="1"/>
    <!-- Cockpit -->
    <path d="M50 46 Q58 50 50 62 Q42 50 50 46 Z"
      fill="url(#cockpitGrad)" stroke="#a8d4f0" stroke-width="1.2" opacity="0.9" filter="url(#cockpitGlow)"/>
    <!-- Pilot sphere -->
    <circle cx="50" cy="48" r="2.5" fill="#d4e6ff" opacity="0.7"/>
    <circle cx="50" cy="48" r="1" fill="#1a5a8a"/>
  </g>

  <!-- Pulse cannons -->
  <g stroke="#63B3ED" stroke-width="1.5" fill="none">
    <path d="M60 36 L72 48 M72 48 L68 52 M68 52 L60 44 Z"/>
    <path d="M48 36 L36 48 M36 48 L40 52 M40 52 L48 44 Z"/>
  </g>
  <g fill="#4facfe" filter="url(#weaponGlow)">
    <circle cx="70" cy="48" r="1.6"/>
    <circle cx="40" cy="48" r="1.6"/>
  </g>

  <!-- Energy cables -->
  <path d="M50 62 L50 70" stroke="#2ec4b6" stroke-width="1" opacity="0.6"/>
  <circle cx="50" cy="66" r="1.5" fill="#4facfe" filter="url(#weaponGlow)"/>
  <path d="M50 70 L58 74" stroke="#2ec4b6" stroke-width="1" opacity="0.5"/>
  <circle cx="54" cy="72" r="1.2" fill="#4facfe" filter="url(#weaponGlow)"/>

  <!-- Targeting array -->
  <g fill="#4facfe">
    <circle cx="50" cy="30" r="1.2"/>
    <circle cx="44" cy="32" r="1"/>
    <circle cx="56" cy="32" r="1"/>
  </g>

  <!-- Engine exhausts -->
  <g filter="url(#engineGlow)">
    <path d="M16 90 L14 96 L26 98 L26 88 Z" fill="url(#exhaustGrad)" opacity="0.85"/>
    <path d="M94 90 L96 96 L84 98 L83 88 Z" fill="url(#exhaustGrad)" opacity="0.85"/>
  </g>
  <!-- Plasma cores -->
  <g filter="url(#engineGlow)">
    <rect x="18" y="92" width="3" height="5" fill="url(#plasmaGrad)" opacity="0.9"/>
    <rect x="89" y="92" width="3" height="5" fill="url(#plasmaGrad)" opacity="0.9"/>
  </g>
  <!-- Engine flame / afterburner -->
  <g filter="url(#engineGlow)">
    <path d="M19 97 L15 103 L24 101 L22 97 Z" fill="url(#exhaustGrad)" opacity="0.6"/>
    <path d="M92 97 L96 103 L87 101 L89 97 Z" fill="url(#exhaustGrad)" opacity="0.6"/>
  </g>
  <!-- Exhaust trails -->
  <path d="M20 100 L19 104 M89 100 L90 104" stroke="#4facfe" stroke-width="1.2" opacity="0.4"/>
  <path d="M20 102 L18 106 M91 102 L92 106" stroke="#2ec4b6" stroke-width="1" opacity="0.35"/>

  <!-- Targeting reticle -->
  <g stroke="#63B3ED" stroke-width="1" fill="none" opacity="0.75">
    <circle cx="50" cy="55" r="9"/>
    <circle cx="50" cy="55" r="3"/>
    <line x1="41" y1="55" x2="59" y2="55"/>
    <line x1="50" y1="46" x2="50" y2="64"/>
    <line x1="35" y1="40" x2="65" y2="70"/>
    <line x1="35" y1="70" x2="65" y2="40"/>
  </g>
  <circle cx="50" cy="55" r="1.8" fill="#4facfe" filter="url(#weaponGlow)"/>
</svg>
