<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="w-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a8bfd"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d419d"/>
    </linearGradient>
    <linearGradient id="w-gloss" x1="6" y1="6" x2="6" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="w-sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(25 25) rotate(90) scale(13)">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
    <filter id="w-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="w-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#021438" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="w-cloud" x1="22" y1="22" x2="38" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1ebf7"/>
    </linearGradient>
  </defs>

  <!-- Base tile with macOS 14px radius -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#w-bg)"/>
  <!-- Top gloss highlight -->
  <path d="M20 6H44A14 14 0 0 1 58 20V30H6V20A14 14 0 0 1 20 6Z" fill="url(#w-gloss)"/>

  <!-- Sun rays -->
  <g opacity="0.8" stroke="#ffca28" stroke-width="2" stroke-linecap="round">
    <path d="M25 10v4.5"/>
    <path d="M25 35.5v4.5"/>
    <path d="M10 25h4.5"/>
    <path d="M35.5 25h4.5"/>
    <path d="M14.4 14.4l3.2 3.2"/>
    <path d="M32.4 32.4l3.2 3.2"/>
    <path d="M35.6 14.4l-3.2 3.2"/>
    <path d="M17.6 32.4l-3.2 3.2"/>
  </g>

  <!-- Glowing Sun Body -->
  <circle cx="25" cy="25" r="11" fill="url(#w-sun)" filter="url(#w-glow)"/>
  <circle cx="22" cy="22" r="3.5" fill="#ffffff" opacity="0.6"/>

  <!-- Volumetric Cloud with Drop Shadow -->
  <g filter="url(#w-soft)">
    <path d="M44 44H22.5a9.5 9.5 0 1 1 3.3-18.4A10.5 10.5 0 0 1 45 30.3 7.7 7.7 0 0 1 44 44Z" fill="url(#w-cloud)"/>
    <path d="M41 41.5H23.5a6.8 6.8 0 1 1 2.2-13.2 8.1 8.1 0 0 1 14.8 3.6 5.6 5.6 0 0 1 0.5 9.6Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
