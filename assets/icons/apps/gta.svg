<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gtaSky" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ff9a6c"/>
      <stop offset="0.3%" stop-color="#ffb98c"/>
      <stop offset="0.6%" stop-color="#9cc5e8"/>
      <stop offset="1" stop-color="#c8dce8"/>
    </linearGradient>
    <linearGradient id="gtaRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6f9e"/>
      <stop offset="1" stop-color="#2e5f8a"/>
    </linearGradient>
    <linearGradient id="gtaSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffd06a"/>
    </linearGradient>
    <linearGradient id="gtaBrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c97350"/>
      <stop offset="1" stop-color="#8a4527"/>
    </linearGradient>
    <linearGradient id="gtaGlass" x1="0" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d4f0"/>
      <stop offset="1" stop-color="#5a8db0"/>
    </linearGradient>
    <linearGradient id="gtaLime" x1="0" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6d8a8"/>
      <stop offset="1" stop-color="#a89968"/>
    </linearGradient>
    <linearGradient id="gtaStreet" x1="0" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7d85"/>
      <stop offset="1" stop-color="#4a4d55"/>
    </linearGradient>
    <filter id="gtaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="gtaStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="128" height="128" rx="24" fill="url(#gtaSky)"/>
  <!-- Sun -->
  <circle cx="100" cy="22" r="11" fill="url(#gtaSun)" opacity="0.95"/>
  <circle cx="100" cy="22" r="15" fill="#ffe9b0" opacity="0.2"/>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.7">
    <ellipse cx="30" cy="20" rx="9" ry="2.5"/>
    <ellipse cx="35" cy="18" rx="5" ry="2"/>
    <ellipse cx="65" cy="14" rx="7" ry="2"/>
    <ellipse cx="115" cy="34" rx="6" ry="1.8"/>
  </g>

  <!-- Far back row (limestone buildings) -->
  <g fill="url(#gtaLime)">
    <rect x="4" y="50" width="10" height="40"/>
    <rect x="16" y="44" width="8" height="46"/>
    <rect x="26" y="52" width="10" height="38"/>
    <rect x="38" y="46" width="8" height="44"/>
    <rect x="48" y="54" width="9" height="36"/>
    <rect x="86" y="52" width="10" height="38"/>
    <rect x="98" y="46" width="8" height="44"/>
    <rect x="108" y="50" width="10" height="40"/>
    <rect x="120" y="56" width="6" height="34"/>
  </g>
  <!-- Far back windows -->
  <g fill="#3d4a5c" opacity="0.4">
    <rect x="6" y="54" width="2" height="2"/>
    <rect x="10" y="54" width="2" height="2"/>
    <rect x="6" y="60" width="2" height="2"/>
    <rect x="10" y="60" width="2" height="2"/>
    <rect x="6" y="66" width="2" height="2"/>
    <rect x="10" y="66" width="2" height="2"/>
    <rect x="6" y="72" width="2" height="2"/>
    <rect x="10" y="72" width="2" height="2"/>
    <rect x="6" y="78" width="2" height="2"/>
    <rect x="10" y="78" width="2" height="2"/>
    <rect x="18" y="48" width="2" height="2"/>
    <rect x="22" y="48" width="2" height="2"/>
    <rect x="18" y="54" width="2" height="2"/>
    <rect x="22" y="54" width="2" height="2"/>
    <rect x="18" y="60" width="2" height="2"/>
    <rect x="22" y="60" width="2" height="2"/>
    <rect x="18" y="66" width="2" height="2"/>
    <rect x="22" y="66" width="2" height="2"/>
    <rect x="18" y="72" width="2" height="2"/>
    <rect x="22" y="72" width="2" height="2"/>
    <rect x="18" y="78" width="2" height="2"/>
    <rect x="22" y="78" width="2" height="2"/>
    <rect x="28" y="56" width="2" height="2"/>
    <rect x="32" y="56" width="2" height="2"/>
    <rect x="28" y="62" width="2" height="2"/>
    <rect x="32" y="62" width="2" height="2"/>
    <rect x="28" y="68" width="2" height="2"/>
    <rect x="32" y="68" width="2" height="2"/>
    <rect x="28" y="74" width="2" height="2"/>
    <rect x="32" y="74" width="2" height="2"/>
    <rect x="40" y="50" width="2" height="2"/>
    <rect x="44" y="50" width="2" height="2"/>
    <rect x="40" y="56" width="2" height="2"/>
    <rect x="44" y="56" width="2" height="2"/>
    <rect x="40" y="62" width="2" height="2"/>
    <rect x="44" y="62" width="2" height="2"/>
    <rect x="40" y="68" width="2" height="2"/>
    <rect x="44" y="68" width="2" height="2"/>
    <rect x="40" y="74" width="2" height="2"/>
    <rect x="44" y="74" width="2" height="2"/>
    <rect x="88" y="56" width="2" height="2"/>
    <rect x="92" y="56" width="2" height="2"/>
    <rect x="88" y="62" width="2" height="2"/>
    <rect x="92" y="62" width="2" height="2"/>
    <rect x="88" y="68" width="2" height="2"/>
    <rect x="92" y="68" width="2" height="2"/>
    <rect x="88" y="74" width="2" height="2"/>
    <rect x="92" y="74" width="2" height="2"/>
    <rect x="100" y="50" width="2" height="2"/>
    <rect x="104" y="50" width="2" height="2"/>
    <rect x="100" y="56" width="2" height="2"/>
    <rect x="104" y="56" width="2" height="2"/>
    <rect x="100" y="62" width="2" height="2"/>
    <rect x="104" y="62" width="2" height="2"/>
    <rect x="100" y="68" width="2" height="2"/>
    <rect x="104" y="68" width="2" height="2"/>
    <rect x="100" y="74" width="2" height="2"/>
    <rect x="104" y="74" width="2" height="2"/>
    <rect x="100" y="80" width="2" height="2"/>
    <rect x="104" y="80" width="2" height="2"/>
    <rect x="110" y="54" width="2" height="2"/>
    <rect x="114" y="54" width="2" height="2"/>
    <rect x="110" y="60" width="2" height="2"/>
    <rect x="114" y="60" width="2" height="2"/>
    <rect x="110" y="66" width="2" height="2"/>
    <rect x="114" y="66" width="2" height="2"/>
    <rect x="110" y="72" width="2" height="2"/>
    <rect x="114" y="72" width="2" height="2"/>
    <rect x="110" y="78" width="2" height="2"/>
    <rect x="114" y="78" width="2" height="2"/>
  </g>

  <!-- Central Park (green block) -->
  <rect x="56" y="68" width="20" height="22" fill="#3a8a3a"/>
  <rect x="56" y="68" width="20" height="2" fill="#5cb85c"/>
  <g fill="#2a6a2a" opacity="0.6">
    <circle cx="60" cy="76" r="1.5"/>
    <circle cx="66" cy="80" r="1.5"/>
    <circle cx="72" cy="74" r="1.5"/>
    <circle cx="68" cy="86" r="1.5"/>
  </g>
  <g fill="#1a4a1a" opacity="0.7">
    <rect x="59.5" y="75" width="1" height="3"/>
    <rect x="65.5" y="79" width="1" height="3"/>
    <rect x="71.5" y="73" width="1" height="3"/>
  </g>

  <!-- Empire-style setback brick tower (centerpiece) -->
  <g>
    <rect x="62" y="22" width="8" height="68" fill="url(#gtaBrick)" stroke="#5a2818" stroke-width="0.5"/>
    <rect x="58" y="40" width="16" height="50" fill="url(#gtaBrick)" stroke="#5a2818" stroke-width="0.5"/>
    <rect x="54" y="58" width="24" height="32" fill="url(#gtaBrick)" stroke="#5a2818" stroke-width="0.5"/>
    <!-- Antenna -->
    <rect x="65" y="12" width="2" height="10" fill="#8a8a90"/>
    <rect x="64" y="10" width="4" height="2" fill="#a8a8b0"/>
    <circle cx="66" cy="10" r="1" fill="#ff4444" filter="url(#gtaGlow)"/>
  </g>
  <!-- Empire-style windows -->
  <g fill="#fff3c4" opacity="0.7">
    <rect x="63" y="24" width="6" height="2"/>
    <rect x="63" y="28" width="6" height="2"/>
    <rect x="63" y="32" width="6" height="2"/>
    <rect x="63" y="36" width="6" height="2"/>
    <rect x="59" y="42" width="14" height="2"/>
    <rect x="59" y="46" width="14" height="2"/>
    <rect x="59" y="50" width="14" height="2"/>
    <rect x="59" y="54" width="14" height="2"/>
    <rect x="55" y="60" width="22" height="2"/>
    <rect x="55" y="64" width="22" height="2"/>
    <rect x="55" y="68" width="22" height="2"/>
    <rect x="55" y="72" width="22" height="2"/>
    <rect x="55" y="76" width="22" height="2"/>
    <rect x="55" y="80" width="22" height="2"/>
    <rect x="55" y="84" width="22" height="2"/>
  </g>
  <!-- Window frames -->
  <g stroke="#5a2818" stroke-width="0.3" fill="none">
    <line x1="66" y1="24" x2="66" y2="36"/>
    <line x1="66" y1="42" x2="66" y2="54"/>
    <line x1="66" y1="60" x2="66" y2="84"/>
  </g>

  <!-- Glass tower (right) -->
  <g>
    <rect x="78" y="36" width="10" height="54" fill="url(#gtaGlass)" stroke="#3a5a78" stroke-width="0.5"/>
    <polygon points="78,36 83,30 88,36" fill="url(#gtaGlass)" stroke="#3a5a78" stroke-width="0.5"/>
    <rect x="82" y="28" width="2" height="3" fill="#8a8a90"/>
  </g>
  <!-- Glass tower windows -->
  <g fill="#fff" opacity="0.5">
    <rect x="79" y="38" width="3" height="2"/>
    <rect x="84" y="38" width="3" height="2"/>
    <rect x="79" y="42" width="3" height="2"/>
    <rect x="84" y="42" width="3" height="2"/>
    <rect x="79" y="46" width="3" height="2"/>
    <rect x="84" y="46" width="3" height="2"/>
    <rect x="79" y="50" width="3" height="2"/>
    <rect x="84" y="50" width="3" height="2"/>
    <rect x="79" y="54" width="3" height="2"/>
    <rect x="84" y="54" width="3" height="2"/>
    <rect x="79" y="58" width="3" height="2"/>
    <rect x="84" y="58" width="3" height="2"/>
    <rect x="79" y="62" width="3" height="2"/>
    <rect x="84" y="62" width="3" height="2"/>
    <rect x="79" y="66" width="3" height="2"/>
    <rect x="84" y="66" width="3" height="2"/>
    <rect x="79" y="70" width="3" height="2"/>
    <rect x="84" y="70" width="3" height="2"/>
    <rect x="79" y="74" width="3" height="2"/>
    <rect x="84" y="74" width="3" height="2"/>
    <rect x="79" y="78" width="3" height="2"/>
    <rect x="84" y="78" width="3" height="2"/>
    <rect x="79" y="82" width="3" height="2"/>
    <rect x="84" y="82" width="3" height="2"/>
  </g>

  <!-- East River -->
  <rect x="0" y="90" width="128" height="14" fill="url(#gtaRiver)"/>
  <!-- River ripples -->
  <g stroke="#fff" stroke-width="0.4" opacity="0.4" fill="none">
    <path d="M4 94 Q8 93 12 94 T20 94"/>
    <path d="M30 96 Q34 95 38 96 T46 96"/>
    <path d="M60 98 Q64 97 68 98 T76 98"/>
    <path d="M88 94 Q92 93 96 94 T104 94"/>
    <path d="M110 96 Q114 95 118 96 T126 96"/>
  </g>

  <!-- Suspension bridge cables (right side) -->
  <g stroke="#3a3a40" stroke-width="0.6" fill="none">
    <path d="M90 90 L92 78 L94 90"/>
    <path d="M92 78 Q96 75 100 78"/>
    <path d="M94 90 L102 80"/>
    <path d="M94 90 L98 82"/>
    <line x1="92" y1="90" x2="92" y2="104"/>
    <line x1="102" y1="90" x2="102" y2="104"/>
  </g>
  <!-- Bridge deck -->
  <rect x="86" y="88" width="20" height="2" fill="#5a5d65"/>

  <!-- Brooklyn side (right edge) -->
  <g fill="url(#gtaLime)">
    <rect x="108" y="80" width="20" height="10"/>
  </g>
  <g fill="#3d4a5c" opacity="0.4">
    <rect x="110" y="82" width="2" height="2"/>
    <rect x="114" y="82" width="2" height="2"/>
    <rect x="118" y="82" width="2" height="2"/>
    <rect x="122" y="82" width="2" height="2"/>
  </g>

  <!-- Street (bottom foreground) -->
  <rect x="0" y="100" width="128" height="28" fill="url(#gtaStreet)"/>
  <!-- Sidewalk -->
  <rect x="0" y="98" width="128" height="2" fill="#a8aab0"/>
  <!-- Lane markings -->
  <g fill="#f4d03f">
    <rect x="6" y="113" width="6" height="1.5"/>
    <rect x="18" y="113" width="6" height="1.5"/>
    <rect x="30" y="113" width="6" height="1.5"/>
    <rect x="42" y="113" width="6" height="1.5"/>
    <rect x="54" y="113" width="6" height="1.5"/>
    <rect x="66" y="113" width="6" height="1.5"/>
    <rect x="78" y="113" width="6" height="1.5"/>
    <rect x="90" y="113" width="6" height="1.5"/>
    <rect x="102" y="113" width="6" height="1.5"/>
    <rect x="114" y="113" width="6" height="1.5"/>
  </g>
  <!-- Street intersection (vertical) -->
  <rect x="62" y="100" width="4" height="28" fill="#7a7d85"/>
  <rect x="63" y="100" width="2" height="28" fill="#a8aab0" opacity="0.3"/>

  <!-- Yellow taxi (foreground) -->
  <g transform="translate(34 104)">
    <rect x="-14" y="-8" width="28" height="7" rx="2" fill="#f7c948"/>
    <rect x="-9" y="-11" width="15" height="4" rx="1.5" fill="#e8b830"/>
    <rect x="-8" y="-10.5" width="13" height="3" fill="#20303d"/>
    <rect x="-15" y="-8.5" width="2" height="2" fill="#fff3c4"/>
    <rect x="13" y="-8.5" width="2" height="2" fill="#e8453a"/>
    <circle cx="-8" cy="0" r="3" fill="#1c1c20"/>
    <circle cx="8" cy="0" r="3" fill="#1c1c20"/>
    <circle cx="-8" cy="0" r="1.5" fill="#5a5a5e"/>
    <circle cx="8" cy="0" r="1.5" fill="#5a5a5e"/>
    <!-- Taxi sign -->
    <rect x="-2" y="-13" width="4" height="2" fill="#f7c948" stroke="#7a5a00" stroke-width="0.3"/>
  </g>

  <!-- Red sports car -->
  <g transform="translate(80 108)">
    <rect x="-10" y="-6" width="20" height="5" rx="1.5" fill="#c92e1e"/>
    <rect x="-7" y="-8" width="12" height="3" rx="1" fill="#a52d1f"/>
    <rect x="-6" y="-7.5" width="10" height="2" fill="#1a2a3a"/>
    <rect x="-11" y="-6.5" width="1.5" height="1.5" fill="#ffd700"/>
    <rect x="9" y="-6.5" width="1.5" height="1.5" fill="#cc0000"/>
    <circle cx="-6" cy="0" r="2.5" fill="#1c1c20"/>
    <circle cx="6" cy="0" r="2.5" fill="#1c1c20"/>
    <circle cx="-6" cy="0" r="1.2" fill="#5a5a5e"/>
    <circle cx="6" cy="0" r="1.2" fill="#5a5a5e"/>
  </g>

  <!-- Police cruiser -->
  <g transform="translate(108 105)">
    <rect x="-9" y="-6" width="18" height="5" rx="1.5" fill="#1a1a1a"/>
    <rect x="-6" y="-8" width="10" height="3" rx="1" fill="#2a2a2a"/>
    <rect x="-5" y="-7.5" width="8" height="2" fill="#1a3a5a"/>
    <rect x="-10" y="-6.5" width="1.5" height="1.5" fill="#fff"/>
    <rect x="8" y="-6.5" width="1.5" height="1.5" fill="#cc0000"/>
    <circle cx="-5" cy="0" r="2.2" fill="#1c1c20"/>
    <circle cx="5" cy="0" r="2.2" fill="#1c1c20"/>
    <circle cx="-5" cy="0" r="1" fill="#5a5a5e"/>
    <circle cx="5" cy="0" r="1" fill="#5a5a5e"/>
    <!-- Light bar -->
    <rect x="-3" y="-9" width="6" height="1.5" fill="#fff" stroke="#1a1a1a" stroke-width="0.3"/>
    <rect x="-2" y="-9" width="2" height="1.5" fill="#0066ff" filter="url(#gtaGlow)"/>
    <rect x="1" y="-9" width="2" height="1.5" fill="#ff0040" filter="url(#gtaGlow)"/>
  </g>

  <!-- Helicopter -->
  <g transform="translate(50 30)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#2a2a2a"/>
    <rect x="-2" y="-1" width="3" height="2" fill="#5a8db0" opacity="0.6"/>
    <!-- Tail -->
    <rect x="4" y="-0.5" width="6" height="1" fill="#2a2a2a"/>
    <rect x="9" y="-1.5" width="1" height="3" fill="#2a2a2a"/>
    <!-- Rotor -->
    <rect x="-8" y="-0.3" width="16" height="0.6" fill="#5a5a5e" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="8" ry="0.4" fill="#5a5a5e" opacity="0.4"/>
    <!-- Skids -->
    <rect x="-3" y="2" width="6" height="0.4" fill="#1a1a1a"/>
    <line x1="-2" y1="2" x2="-2" y2="3.5" stroke="#1a1a1a" stroke-width="0.3"/>
    <line x1="2" y1="2" x2="2" y2="3.5" stroke="#1a1a1a" stroke-width="0.3"/>
  </g>

  <!-- Wanted star (top-left, glowing) -->
  <g transform="translate(20 22)" filter="url(#gtaStarGlow)">
    <polygon points="0,-9 2.7,-2.7 9,-2.7 3.8,1.4 5.8,8 0,4 -5.8,8 -3.8,1.4 -9,-2.7 -2.7,-2.7"
      fill="#ffd94d" stroke="#a8791a" stroke-width="1.2"/>
    <polygon points="0,-5 1.5,-1.5 5,-1.5 2,0.5 3.2,4 0,2 -3.2,4 -2,0.5 -5,-1.5 -1.5,-1.5"
      fill="#fff3a0" opacity="0.6"/>
  </g>

  <!-- "WANTED" text below star -->
  <g transform="translate(20 36)">
    <rect x="-13" y="-3" width="26" height="6" fill="#1a1a1a" opacity="0.85" rx="1"/>
    <text x="0" y="2" font-family="Impact, sans-serif" font-size="5" font-weight="bold"
      text-anchor="middle" fill="#ffd94d" letter-spacing="0.5">WANTED</text>
  </g>

  <!-- Mini-map circle (bottom-right) -->
  <g transform="translate(112 122)">
    <circle r="5" fill="#1a1a1a" stroke="#fff" stroke-width="0.6"/>
    <path d="M-4 -1 L4 -1 L4 1 L-4 1 Z" fill="#3a3a3a"/>
    <path d="M-1 -4 L1 -4 L1 4 L-1 4 Z" fill="#3a3a3a"/>
    <circle cx="0" cy="0" r="1" fill="#0066ff"/>
    <circle cx="-2" cy="-2" r="0.6" fill="#ff0040"/>
    <circle cx="2" cy="2" r="0.6" fill="#ffd94d"/>
  </g>
</svg>
